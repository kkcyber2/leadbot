name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 is no longer published for ubuntu-24.04+ (the `ubuntu-latest`
          # label moved to 26.04 in Oct 2026 and setup-python cannot find it),
          # so the oldest supported interpreter is pinned to an older image.
          - python: "3.9"
            os: ubuntu-22.04
          - python: "3.11"
            os: ubuntu-latest
          - python: "3.12"
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile both modules
        run: python -m py_compile leadbot.py localbot.py

      - name: Run test suite
        run: python -m pytest -q --tb=short

      - name: Smoke-test the CLI entry points
        # --help must never touch the network or send anything, so this proves
        # argument parsing and imports work without a live run.
        run: |
          python leadbot.py --help
          python localbot.py --help
